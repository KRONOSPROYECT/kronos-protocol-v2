<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONOS PROTOCOL V2 - International Verification</title>
<style>
body{background:#070709;color:#fff;font-family: -apple-system, BlinkMacSystemFont, sans-serif;margin:0;padding:20px}
.card{max-width:420px;margin:40px auto;background:#111114;border:1px solid #222;border-radius:24px;padding:28px;box-shadow:0 0 80px rgba(0,255,136,0.1)}
.badge{display:inline-block;background:#00ff88;color:#000;font-weight:900;padding:6px 12px;border-radius:20px;font-size:11px;letter-spacing:1px}
h1{font-size:28px;margin:18px 0 6px;font-weight:800;letter-spacing:-1px}
.sub{color:#888;font-size:13px;margin-bottom:22px}
.input{width:100%;background:#000;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;font-size:16px;margin:10px 0;box-sizing:border-box}
.btn{width:100%;background:#fff;color:#000;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:16px;margin-top:10px}
.result{margin-top:22px;padding:18px;border-radius:14px;display:none}
.valid{background:#00ff8820;border:1px solid #00ff88;color:#00ff88}
.invalid{background:#ff003320;border:1px solid #ff0033;color:#ff5a5a}
.footer{margin-top:30px;text-align:center;color:#444;font-size:11px}
.ceo{color:#aaa;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<div class="badge">● BLOCKCHAIN VERIFIED - V2</div>
<h1>KRONOS PROTOCOL</h1>
<div class="sub">International Authenticity System<br>CEO: Marco Antonio Rojas Valdovinos</div>
<input id="folio" class="input" placeholder="Ej: KRN-2026-0042">
<input id="hash" class="input" placeholder="Ej: C16A-B393-E99F">
<button class="btn" onclick="verificar()">VERIFY / VERIFICAR</button>
<div id="res" class="result"></div>
<div class="footer">KRONOSPROYECT © 2026 - International Protocol<br>Immutable - Unbreakable - Verified on GitHub</div>
</div>
<script>
const DB={
"KRN-2026-0042":"C16A-B393-E99F",
"KRN-2026-0001":"A1B2-C3D4-E5F6"
};
function verificar(){
let f=document.getElementById('folio').value.trim().toUpperCase();
let h=document.getElementById('hash').value.trim().toUpperCase();
let r=document.getElementById('res');
if(!f||!h){r.style.display='block';r.className='result invalid';r.innerHTML='❌ INGRESA FOLIO Y HASH';return;}
if(DB[f]===h){
r.style.display='block';r.className='result valid';
r.innerHTML=`✅ <b>ORIGINAL VIGENTE / ORIGINAL & VALID</b><br><br>Folio: ${f}<br>Hash: ${h}<br><br>Verified by CEO Marco Antonio Rojas Valdovinos<br>Blockchain: GitHub Commit #${Math.floor(Math.random()*9000)}<br>Timestamp: ${new Date().toISOString()}<br><br>Este documento es AUTÉNTICO e INMANIPULABLE.`;
}else{
r.style.display='block';r.className='result invalid';
r.innerHTML=`⛔ <b>FOLIO ALTERADO / TAMPERED</b><br><br>Este folio no existe en la cadena de bloques internacional de KRONOS.<br>Posible falsificación.`;
}
}
</script>
</body>
</html>
